[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pof"
version = "1.0.0"
description = "Prompt Optimization Framework — low-cost, auditable prompt evolution"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9,<3.14"
authors = [
    {name = "Silverio RJ"},
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.38",
    "numpy>=1.24",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "datasets>=2.14",
    "openai>=1.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[project.scripts]
pof = "pof.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pof*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]