# EXP-018: SWIFT step 2 -- swift_v2 (already-implemented audited fixes:
# drops weak trajectory_climb, anchors crossover on elite, adds length-aware
# dedup/selection) at population_size=5, frontier_pull_prob=0.0 (Pareto
# still disabled, same as step1) -- isolates the audited-fixes bundle
# against step1's clean baseline.
llm:
  backend: huggingface
  model_name: Qwen/Qwen3-4B-Instruct-2507
  device: auto
  dtype: auto
  max_new_tokens: 512
  batch_size: 6
  thinking_mode: false

evaluation:
  sample_size: 50
  full_eval_size: 115
  temperature: 0.0
  max_new_tokens: 32
  batch_size: 16
  racing_enabled: true
  racing_confidence: 0.05
  racing_min_samples: 10

optimizer:
  population_size: 5
  seed_prompt: ""
  params:
    frontier_pull_prob: 0.0

output_dir: outputs/humaneval_swift_step2_v2_audited_fixes
seed: 42
verbose: true

budget:
  time_seconds: 3600
  max_calls: 5000
  max_total_tokens: 5000000
  max_generations: 10
  early_stop_patience: 3

seeds: [42, 123, 7]
