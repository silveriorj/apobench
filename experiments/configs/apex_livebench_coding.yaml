# EXP-027: APEX+Pareto on LiveBench Coding, Qwen3-4B.
#
# New dataset — no prior APO results exist. Comparison strategy:
#   - Primary: vs. baseline_seed
#   - Secondary: published Qwen3-4B LiveBench coding scores (where known)
#   - No other-method comparison
#
# Dataset: livebench/coding (HF), ~128 problems (LeetCode-style functional).
#   Splits (small-dataset branch): 92 test, 33 dev, 3 train.
#   task_type: "code" — subprocess execution scorer, all-or-nothing per problem.
#
# IMPORTANT: dev=33 is small. After holdout reservation (~30% = ~10 items),
# optimization pool is ~23 items — HoldoutSelectionMixin will fall back to
# single-pool selection (below MIN_HOLDOUT_N=12). This is fine; log and note.
# eval_max_new_tokens=2048 (same as HumanEval — LeetCode completions are longer).
#
# full_eval_size capped at 92 (total test available); runner handles overflow.
llm:
  backend: huggingface
  model_name: Qwen/Qwen3-4B-Instruct-2507
  device: auto
  dtype: auto
  max_new_tokens: 1512
  batch_size: 6
  thinking_mode: false

evaluation:
  sample_size: 50
  full_eval_size: 115      # runner will use min(115, len(test)) = 92
  temperature: 0.0
  max_new_tokens: 2048
  batch_size: 8            # smaller batch: subprocess execution per sample is slow
  racing_enabled: true
  racing_confidence: 0.05
  racing_min_samples: 10

optimizer:
  population_size: 8
  seed_prompt: ""
  num_iterations: 5
  params:
    frontier_pull_prob: 0.5

output_dir: outputs/livebench_coding_apex_pareto
seed: 42
verbose: true

budget:
  time_seconds: 10800      # 3h — subprocess execution adds wall-clock vs. HumanEval
  max_calls: 5000
  max_total_tokens: 5000000
  max_generations: 5
  early_stop_patience: 3

seeds: [42, 123, 7]
