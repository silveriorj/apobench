# EXP-028: APEX+Pareto on LiveBench Coding, Qwen3-4B, 5 seeds.
#
# livebench/coding: 128 LeetCode-style problems with public + private test cases.
# 50/50 dev/test split (--dev-test-split 0.5): 8 train, ~60 dev, ~60 test.
# task_type=code; scoring via functional test execution (_score_livecodebench).
# Eval cap: 1256 tokens (hard cap, no adaptive extension).
# Launch with: --dev-test-split 0.5
llm:
  backend: huggingface
  model_name: Qwen/Qwen3-4B-Instruct-2507
  device: auto
  dtype: auto
  max_new_tokens: 1512
  batch_size: 6
  thinking_mode: false

evaluation:
  sample_size: 50
  full_eval_size: 60
  temperature: 0.0
  max_new_tokens: 1256
  batch_size: 16
  racing_enabled: true
  racing_confidence: 0.05
  racing_min_samples: 10

optimizer:
  population_size: 8
  seed_prompt: ""
  num_iterations: 5
  params:
    frontier_pull_prob: 0.5

output_dir: outputs/livebench_coding_apex_pareto
seed: 42
verbose: true

budget:
  time_seconds: 7200
  max_calls: 5000
  max_total_tokens: 5000000
  max_generations: 5
  early_stop_patience: 3

seeds: [42, 123, 7, 0, 1]
