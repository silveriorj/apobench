# EXP-026: APEX+Pareto on LiveBench Math, Qwen3-4B.
#
# New dataset — no prior APO results exist. Comparison strategy:
#   - Primary: vs. baseline_seed (deterministic seed prompt at test time)
#   - Secondary: published Qwen3-4B LiveBench math scores (where known)
#   - No other-method comparison (SWIFT/SCOPE/etc. not run here yet)
#
# Dataset: livebench/math (HF), all subtasks combined.
#   Splits: 115 test, 245 dev (large dev pool — opt@50 covers ~20% of dev).
#   task_type: "math" — scorer uses final_em / \boxed{} aware exact match.
#
# Note: livebench_math dev=245 gives a healthy opt pool and holdout; expect
# the MDE to sit at a similar level to HumanEval (~9-10pp on n=115).
# eval_max_new_tokens=512: competition math (AMC/AIME) needs room for boxed answers.
llm:
  backend: huggingface
  model_name: Qwen/Qwen3-4B-Instruct-2507
  device: auto
  dtype: auto
  max_new_tokens: 1512
  batch_size: 6
  thinking_mode: false

evaluation:
  sample_size: 50
  full_eval_size: 115
  temperature: 0.0
  max_new_tokens: 4096
  batch_size: 16
  racing_enabled: true
  racing_confidence: 0.05
  racing_min_samples: 10

optimizer:
  population_size: 8
  seed_prompt: ""
  num_iterations: 5
  params:
    frontier_pull_prob: 0.5

output_dir: outputs/livebench_math_apex_pareto
seed: 42
verbose: true

budget:
  time_seconds: 7200
  max_calls: 5000
  max_total_tokens: 5000000
  max_generations: 5
  early_stop_patience: 3

seeds: [42, 123, 7]
