# =============================================================================
# POF Experiment Config: SWIFT & APEX on BBH, GSM8K, HumanEval
# =============================================================================
# Model: Qwen/Qwen3-4B-Instruct-2507
# Eval samples: 44 per optimization step
# Final test samples: ~112-150 per task (60% of 187-250 BBH examples)
# CoT: Handled in output (max_new_tokens adjusted per task type)
# =============================================================================

# --- LLM Configuration ---
llm:
  backend: huggingface
  model_name: Qwen/Qwen3-4B-Instruct-2507  # GQA 8 KV heads, ~8 GB weights on bf16
  device: auto
  dtype: auto
  max_new_tokens: 512      # Operator generation tokens (mutation, crossover, EDA)
  batch_size: 6            # Unused by HF backend directly; kept for reference
  thinking_mode: false

# --- Evaluation Configuration ---
evaluation:
  sample_size: 50          # Samples per optimization eval step (from dev split)
  full_eval_size: 115      # Final test evaluation samples (fixed test split)
  temperature: 0.0         # Greedy for evaluation
  max_new_tokens: 32       # Short direct answers; model is instructed to skip CoT
  batch_size: 16           # Default; overridden per-task in run_swift_apex.py EVAL_BATCH_SIZE
  racing_enabled: true
  racing_confidence: 0.05
  racing_min_samples: 10

# --- Optimizer Configuration (defaults, overridden per-run) ---
optimizer:
  population_size: 5
  seed_prompt: ""          # Loaded dynamically from prompt repos

# --- Output ---
output_dir: outputs/swift_apex_benchmark
seed: 42
verbose: true

# --- Budget (hard caps) ---
budget:
  time_seconds: 3600         # 1 hour wall-clock cap
  max_calls: 5000            # Total LLM calls cap
  max_total_tokens: 5000000  # Combined input+output tokens cap
  max_generations: 10        # Max optimization generations
  early_stop_patience: 3     # Stop if no improvement for 3 consecutive generations

# --- Multi-seed experiment ---
# Each run is repeated with 3 random seeds for statistical robustness.
# Seeds: 42, 123, 7
seeds: [42, 123, 7]

# =============================================================================
# EXPERIMENT MATRIX
# =============================================================================
# This config defines the base settings. The experiment runner should iterate
# over the combinations below. Use with the RunOrchestrator or experiment script.
#
# Methods: [swift, apex]
#
# Datasets & Tasks:
#
# --- BBH (max_new_tokens: 64 — dyck needs ~20-40 tokens; other tasks need <5) ---
# Seed prompts fetched from: github.com/beeevita/EvoPrompt/main/BBH/lib_prompt/
#
#   - bbh/dyck_languages
#   - bbh/causal_judgement
#   - bbh/disambiguation_qa
#   - bbh/formal_fallacies
#   - bbh/hyperbaton
#   - bbh/logical_deduction_five_objects
#   - bbh/reasoning_about_colored_objects
#
# --- GSM8K (max_new_tokens: 32, direct answers only) ---
# Seed prompt from: github.com/FranxYao/chain-of-thought-hub/.../prompt_simple_4_cases_ao.txt
#
#   - gsm8k (single task)
#
# --- HumanEval (max_new_tokens: 1024 for code generation) ---
#   - humaneval (single task)
#
# =============================================================================