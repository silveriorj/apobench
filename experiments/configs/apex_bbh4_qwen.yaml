# EXP-025: APEX+Pareto on BBH 4-task subset, Qwen3-4B.
#
# Tasks: boolean_expressions, causal_judgement, formal_fallacies, hyperbaton.
# Excluded: dyck_languages (hit 7200s cap, 0pp gain EXP-008/009),
#           navigate (0pp gain EXP-008/009 — seed prompt already optimal).
#
# These 4 tasks have prior APEX (EXP-008/009, seed=42 only, no Pareto) and
# APEX+Pareto (EXP-014, boolean_expressions only, aborted). Running all 4
# with 3 seeds gives the clean comparison: does Pareto add on BBH what it
# added on HumanEval (+4.93pp)?
#
# Comparison targets:
#   - EXP-008/009 APEX no-Pareto seed_42:
#       boolean_expressions +13.1pp, causal_judgement +5.2pp,
#       formal_fallacies +51.3pp, hyperbaton +80.9pp
#   - Gemini flash-lite APEX (EXP-013, 13-task macro): +3.77pp mean
#   - baseline_seed (deterministic, same splits)
llm:
  backend: huggingface
  model_name: Qwen/Qwen3-4B-Instruct-2507
  device: auto
  dtype: auto
  max_new_tokens: 1512
  batch_size: 6
  thinking_mode: false

evaluation:
  sample_size: 50
  full_eval_size: 115
  temperature: 0.0
  max_new_tokens: 2048      # BBH tasks use short direct answers
  batch_size: 16
  racing_enabled: true
  racing_confidence: 0.05
  racing_min_samples: 10

optimizer:
  population_size: 8
  seed_prompt: ""
  num_iterations: 5
  params:
    frontier_pull_prob: 0.5

output_dir: outputs/bbh4_apex_pareto
seed: 42
verbose: true

budget:
  time_seconds: 7200
  max_calls: 5000
  max_total_tokens: 5000000
  max_generations: 5
  early_stop_patience: 3

seeds: [42, 123, 7]
