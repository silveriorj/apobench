# EXP-017: SWIFT step 1 baseline -- population_size=5 (bug-fixed default),
# frontier_pull_prob=0.0 (Pareto fully disabled). Everything else inherited
# from swift_apex_benchmark.yaml's proven settings.
llm:
  backend: huggingface
  model_name: Qwen/Qwen3-4B-Instruct-2507
  device: auto
  dtype: auto
  max_new_tokens: 512
  batch_size: 6
  thinking_mode: false

evaluation:
  sample_size: 50
  full_eval_size: 115
  temperature: 0.0
  max_new_tokens: 32
  batch_size: 16
  racing_enabled: true
  racing_confidence: 0.05
  racing_min_samples: 10

optimizer:
  population_size: 5
  seed_prompt: ""
  params:
    frontier_pull_prob: 0.0

output_dir: outputs/humaneval_swift_step1_baseline
seed: 42
verbose: true

budget:
  time_seconds: 3600
  max_calls: 5000
  max_total_tokens: 5000000
  max_generations: 10
  early_stop_patience: 3

seeds: [42, 123, 7]
